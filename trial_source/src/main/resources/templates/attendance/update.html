<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
	th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">
<head>
<meta charset="UTF-8">
<title>勤怠情報変更｜LMS</title>
</head>
<body>

	<th:block th:if="${session.loginUserDto.role == '0001'}">
		<h2>勤怠管理</h2>
	</th:block>

	<!-- 岩本知寛 - Task.27 -->
	<th:block th:if="${#fields.hasErrors('attendanceForm.*')}">
		<div th:each="errMsg : ${#lists.toList(#sets.toSet(#fields.errors('attendanceForm.*')))}">
			<span th:text="|*${errMsg}|" class="help-inline error"></span>
		</div>
	</th:block>

	<th:block th:if="${session.loginUserDto.role != '0001'}">
		<h2>勤怠管理 <small>( [[${attendanceForm.userName}]] )</small></h2>
		<th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
			<h2><small>途中退校日：${dispLeaveDate}</small></h2>
		</th:block>
	</th:block>

	<div class="row">
		<div class="bs-component col-sm-12">
			<form th:action="@{/attendance/update}" method="post">
				<table class="table table-hover dataTable no-footer">
					<!-- 岩本知寛 - Task.29 -->
					<thead style="display: block;">
						<tr>
							<th class="w140">日付</th>
							<th class="w140">コース内容</th>
							<th class="w60"></th>
							<!-- 岩本知寛 - Task.26 -->
							<th class="w180" colspan="3">出勤</th>
							<th class="w180" colspan="3">退勤</th>
							<th class="w80">中抜け時間</th>
							<th class="w70">ステータス</th>
							<th class="w140">備考</th>
						</tr>
					</thead>
					<!-- 岩本知寛 - Task.29 -->
					<tbody style="display: block; overflow-y: scroll; height: 560px;">
						<th:block th:each="dailyAttendanceForm, stat : *{attendanceForm.attendanceList}">
							<tr>
								<th:block>
									<input type="hidden" th:name="|attendanceList[${stat.index}].isToday|" th:value="${dailyAttendanceForm.isToday}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].studentAttendanceId|" th:value="${dailyAttendanceForm.studentAttendanceId}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].trainingDate|" th:value="${dailyAttendanceForm.trainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].dispTrainingDate|" th:value="${dailyAttendanceForm.dispTrainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].sectionName|" th:value="${dailyAttendanceForm.sectionName}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].statusDispName|" th:value="${dailyAttendanceForm.statusDispName}" />
								</th:block>
								<td class="w140">[[${dailyAttendanceForm.dispTrainingDate}]]</td>
								<td class="w140">[[${dailyAttendanceForm.sectionName}]]</td>
								<!-- 岩本知寛 - Task.28 -->
								<td class="w60"><input type="button" class="btn btn-success default-button" value="定時" th:onclick="|regularTime(${stat.index})|" /></td>
								<!-- 岩本知寛 - Task.26 修正開始-->
								<td class="w70">
									<!-- 岩本知寛 - Task.27 -->
									<select th:name="|attendanceList[${stat.index}].trainingStartTimeHour|" class="form-control"
										th:classappend="${#fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].trainingStartTimeHour')} ? errorInput">
										<option th:each="trainingStartTimeHour : ${attendanceForm.hourMap}" 
											th:value="${trainingStartTimeHour.key}" th:inlne="text" class="form-control" 
											th:selected="${trainingStartTimeHour.key == dailyAttendanceForm.trainingStartTimeHour}">[[${trainingStartTimeHour.value}]]</option>
									</select>
								</td>
								<td>:</td>
								<td class="w70">
									<!-- 岩本知寛 - Task.27 -->
									<select th:name="|attendanceList[${stat.index}].trainingStartTimeMinute|" class="form-control"
										th:classappend="${#fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].trainingStartTimeMinute')} ? errorInput">
										<option th:each="trainingStartTimeMinute : ${attendanceForm.minuteMap}" 
											th:value="${trainingStartTimeMinute.key}" th:inlne="text" class="form-control" 
											th:selected="${trainingStartTimeMinute.key == dailyAttendanceForm.trainingStartTimeMinute}">[[${trainingStartTimeMinute.value}]]</option>
									</select>
								</td>
								<td class="w70">
									<!-- 岩本知寛 - Task.27 -->
									<select th:name="|attendanceList[${stat.index}].trainingEndTimeHour|" class="form-control"
										th:classappend="${#fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].trainingEndTimeHour')} ? errorInput">
										<option th:each="trainingEndTimeHour : ${attendanceForm.hourMap}" 
											th:value="${trainingEndTimeHour.key}" th:inlne="text" class="form-control" 
											th:selected="${trainingEndTimeHour.key == dailyAttendanceForm.trainingEndTimeHour}">[[${trainingEndTimeHour.value}]]</option>
									</select>
								</td>
								<td>:</td>
								<td class="w70">
									<!-- 岩本知寛 - Task.27 -->
									<select th:name="|attendanceList[${stat.index}].trainingEndTimeMinute|" class="form-control"
										th:classappend="${#fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].trainingEndTimeMinute')} ? errorInput">
										<option th:each="trainingEndTimeMinute : ${attendanceForm.minuteMap}" 
											th:value="${trainingEndTimeMinute.key}" th:inlne="text" class="form-control" 
											th:selected="${trainingEndTimeMinute.key == dailyAttendanceForm.trainingEndTimeMinute}">[[${trainingEndTimeMinute.value}]]</option>
									</select>
								</td>
								<!-- 岩本知寛 - Task.26 修正終了-->
								<td class="w80">
									<!-- 岩本知寛 - Task.27 -->
									<select th:name="|attendanceList[${stat.index}].blankTime|" class="form-control"
										th:classappend="${#fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].blankTime')} ? errorInput">
										<option th:each="blankTime : ${attendanceForm.blankTimes}" th:value="${blankTime.key}" th:inlne="text" class="form-control" 
											th:selected="${blankTime.key == dailyAttendanceForm.blankTime}">[[${blankTime.value}]]</option>
									</select>
								</td>
								<td class="w70">[[${dailyAttendanceForm.statusDispName}]]</td>
								<td class="w140">
									<!-- 岩本知寛 - Task.27 -->
									<input type="text" th:name="|attendanceList[${stat.index}].note|" th:value="${dailyAttendanceForm.note}"
										class="form-control" th:classappend="${#fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].note')} ? errorInput" ></input>
								</td>
							</tr>
						</th:block>
					</tbody>
				</table>
				<div class="form-group">
					<th:block th:if="${session.loginUserDto.role == '0001'}">
						<a th:href="@{/attendance/detail}" class="btn btn-default">戻る</a>
					</th:block>
					<th:block th:if="${session.loginUserDto.role != '0001'}">
						<input type="submit" value="戻る" name="indexCompany" class="btn btn-default" />
					</th:block>
					<input type="submit" value="更新" name="complete" class="btn btn-info" onclick="return registCheck();" />
				</div>

			</form>
		</div>
	</div>
	<!-- 岩本知寛 - Task.28 -->
	<script th:inline="javascript">
		/*<![CDATA[*/
		
		// 岩本知寛 - Task.28
		// 定時ボタン押下時に出勤「09:00」/退勤「18:00」を追加する
		function regularTime(indexNo){
			const startTimeHour = document.getElementsByName(`attendanceList[${indexNo}].trainingStartTimeHour`);
			const startTimeMinute = document.getElementsByName(`attendanceList[${indexNo}].trainingStartTimeMinute`);
			const endTimeHour = document.getElementsByName(`attendanceList[${indexNo}].trainingEndTimeHour`);
			const endTimeMinute = document.getElementsByName(`attendanceList[${indexNo}].trainingEndTimeMinute`);

			// nullが配列「0」に存在する都合上、合わせたい数値+1の配列を指定する。
			startTimeHour[0].options[10].selected = true;
			startTimeMinute[0].options[1].selected = true;
			endTimeHour[0].options[19].selected = true;
			endTimeMinute[0].options[1].selected = true;
		}
		
		
		// 岩本知寛 - Task.27
		// 更新ボタン押下時のメッセージ出力処理
		function registCheck() {
			if (confirm("更新します。よろしいですか？")) {
				return true;
			}else{
				return false;
			}
		}
		
		/*]]>*/
	</script>

</body>
</html>
